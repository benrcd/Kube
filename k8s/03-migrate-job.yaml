# =============================================================================
# Job — runs a pod to completion, once.
#
# This is the Kubernetes answer to "who creates the schema on a fresh
# cluster". Unlike a Deployment, a Job is not restarted after it succeeds;
# it runs, exits 0, and is done.
#
# In your Helm chart later this same object gains hook annotations:
#     "helm.sh/hook": pre-install,pre-upgrade
# so that Helm runs it and waits for it before touching the Deployment. For
# now you apply it by hand so you can watch what it does.
#
# Why a Job and not an initContainer on the app: an initContainer runs once
# PER REPLICA. With two replicas you would have two processes racing to apply
# the same migrations, and Laravel does not lock the migrations table by
# default. A Job runs exactly once.
#
# NOTE: a Job's `template` is immutable. To re-run this after editing it you
# must delete it first:  kubectl delete job app-migrate -n sample-app
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: kube-project
spec:
  # How many times to retry the whole pod before giving up. The default is 6.
  # Ten gives the database plenty of time to finish its first-boot
  # initialisation, which takes a while on a fresh volume.
  backoffLimit: 10

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: kube-project
    spec:
      # Never = do not restart the pod on failure; the Job creates a fresh one
      # instead. This is easier to debug, because each attempt leaves its own
      # pod and its own logs behind.
      restartPolicy: Never

      # An initContainer runs to completion BEFORE the main container starts.
      # Here it simply waits until the database is accepting TCP connections.
      # Using the app image means no extra image to load into kind, and `php`
      # is the one tool guaranteed to be present.
      initContainers:
        - name: wait-for-db
          image: laravel-app:v1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for mysql..."
              until php -r 'exit(@fsockopen(getenv("DB_HOST"), (int)getenv("DB_PORT")) ? 0 : 1);'; do
                sleep 2
              done
              echo "mysql is up"
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      containers:
        - name: migrate
          image: laravel-app:v1

          # CRITICAL FOR KIND. The default policy for a non-"latest" tag is
          # already IfNotPresent, but stating it explicitly prevents any
          # attempt to pull from Docker Hub — where this image does not exist.
          # `kind load docker-image` put it directly into the node's runtime.
          imagePullPolicy: IfNotPresent

          command: ["php", "artisan", "migrate", "--force"]

          # envFrom pulls in EVERY key from these two objects as environment
          # variables, rather than naming them one at a time. Much less
          # repetitive than the `valueFrom` style used for MySQL.
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
