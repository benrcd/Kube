# =============================================================================
# Deployment — the Laravel app itself.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kube-project
    app.kubernetes.io/version: "v1"
spec:
  # Two replicas so you can watch a rolling update actually roll. On your
  # single-node kind cluster both land on the same node, which is fine.
  #
  # On AWS you will add podAntiAffinity here to force them onto DIFFERENT
  # nodes — a hard requirement of your project. It is deliberately left out
  # now because with one node it would make the second pod unschedulable.
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0 = never drop below the desired replica count.
      # maxSurge 1 = allow one extra pod temporarily.
      #
      # Together: a new pod must become READY before an old one is removed.
      # This is the core of your CAP-13 requirement. When you later ship a
      # version whose readiness probe fails, the new pod never becomes ready,
      # so no old pod is ever removed, and the rollout stalls with the healthy
      # version still serving every request. That is the behaviour you will
      # demonstrate at the defense.
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/component: web

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: kube-project
        app.kubernetes.io/version: "v1"
    spec:
      # How long Kubernetes waits after SIGTERM before SIGKILL.
      terminationGracePeriodSeconds: 30

      containers:
        - name: app
          image: laravel-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # READINESS — "may this pod receive traffic?"
          # Fails => removed from the Service's endpoint list, no restart.
          #
          # It deliberately hits the static healthz.html and NOT the database.
          # A probe that tested the DB would mark every replica unready during
          # any database blip and take the entire app offline, turning a
          # degraded service into a total outage.
          readinessProbe:
            httpGet:
              path: /healthz.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # LIVENESS — "is this pod broken beyond recovery?"
          # Fails => the container is KILLED and restarted. Keep it slower and
          # more forgiving than readiness; an aggressive liveness probe causes
          # restart loops under load, which is worse than the problem it
          # was meant to solve.
          livenessProbe:
            httpGet:
              path: /healthz.html
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # When a pod is deleted, two things happen AT THE SAME TIME:
          # the container gets SIGTERM, and the Service starts removing it
          # from its endpoint list. Those race, so traffic can arrive at a
          # container that is already shutting down.
          #
          # This sleep delays the shutdown just long enough for the endpoint
          # removal to propagate. It is a small detail that matters a lot for
          # the zero-downtime bonus.
          #
          # Related, for later: Apache treats SIGTERM as an IMMEDIATE stop,
          # killing in-flight requests. The graceful signal is SIGWINCH. Add
          # `STOPSIGNAL SIGWINCH` to your Dockerfile when you get to phase 9.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

---
# =============================================================================
# Service — a stable address for the app.
#
# ClusterIP, so it is reachable only from inside the cluster. You will use
# `kubectl port-forward` to reach it from your laptop.
#
# On AWS this stays ClusterIP and an Ingress sits in front of it, which is
# what terminates TLS and routes by hostname. NodePort belongs to the ingress
# controller, not to your app.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kube-project
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
